# https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/#restoring-an-etcd-cluster
#
# This can only succeed when there is a single control plane.
# Otherwise, the extra etcd nodes will restore the quorum after the restart.
# Effectively overwritting the restored snapshot.
---
- name: Push snapshot
  copy:
    src: "{{ backup_file }}" 
    dest: /tmp/snap.db

- name: Delete etc data folder
  file:
    path: /var/lib/etcd/
    state: absent

- name: Create etcd snapshot
  shell: |
    source /root/.bashrc
    etcdctl --data-dir=/var/lib/etcd snapshot restore /tmp/snap.db

- name: Restart etcd
  shell: |
    POD=$(crictl pods|grep etcd-cp0|grep ' Ready '|awk '{print $1}')
    crictl stopp $POD

- name: Clean snapshot
  file:
    path: /tmp/snap.db
    state: absent
