---
- name: Generate join command
  hosts: cp0
  become: true
  become_user: root

  tasks:

    - name: Create var .join_cmd
      shell: |
        KUBECONFIG=/etc/kubernetes/admin.conf
        kubeadm token create --description 'Worker join short lived token' --print-join-command --ttl 1m | sed 's/kubeadm /kubeadm -v=5 /;s/join [^:]*/join 10.0.0.20/' > /etc/kubernetes/var/.join_cmd

    - name: Fetch join command
      fetch:
        src: /etc/kubernetes/var/.join_cmd
        dest: .join_cmd
        flat: true

    - name: Delete var .join_cmd
      file:
        path: /etc/kubernetes/var/.join_cmd
        state: absent

- name: Join the cluster as a worker node
  hosts: wo0, wo1, wo2, wo3, wo4, wo5
  become: true
  become_user: root

  tasks:

    - name: Create Kubernetes config folders
      file:
        state: directory
        path: "/etc/kubernetes/{{ item }}"
      loop:
        - var
        - manifests

    - name: Check if node has joined a cluster
      stat:
        path: /etc/kubernetes/kubelet.conf 
      register: joined

    - name: Enable kubelet service
      service:
        name: kubelet
        state: started
        enabled: yes

    - name: Get var .join_cmd
      when: not joined.stat.exists
      copy:
        src: .join_cmd
        dest: /etc/kubernetes/var/.join_cmd

    - name: Join the cluster
      when: not joined.stat.exists
      shell: |
        join_cmd=$(cat /etc/kubernetes/var/.join_cmd)
        $join_cmd

    - name: Delete var .join_cmd
      when: not joined.stat.exists
      file:
        path: /etc/kubernetes/var/.join_cmd
        state: absent
