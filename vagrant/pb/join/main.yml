---
- name: Prepare all nodes
  hosts: cp1, cp2, wo0, wo1, wo2, wo3, wo4, wo5
  become: true
  become_user: root

  tasks:

    - name: Enable kubelet service
      service:
        name: kubelet
        state: started
        enabled: yes


- name: Prepare extra control planes 
  vars_files:
    - ../../network.json
  hosts: cp1, cp2
  become: true
  become_user: root

  tasks:

    - name: Install etcdctl
      tags: init
      shell: apk add --allow-untrusted /.lfs/apk/etcd/*

    - name: Create shared certificate directory
      file:
        path: /etc/kubernetes/pki/etcd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Upload certificates
      copy:
        src: "../../.certs/{{ item }}"
        dest: "/etc/kubernetes/pki/{{ item }}"
        owner: root
        group: root
        mode: "{{ '0600' if item.endswith('.key') else '0644' }}"
      loop:
        - ca.crt
        - ca.key
        - sa.key
        - sa.pub
        - front-proxy-ca.crt
        - front-proxy-ca.key
        - etcd/ca.crt
        - etcd/ca.key


- name: Prepare join command
  hosts: cp0
  become: true
  become_user: root

  tasks:

    - name: "Create var .join_cmd_{{ uid }}"
      shell: |
        KUBECONFIG=/etc/kubernetes/admin.conf
        kubeadm token create --description 'Automation short lived join token' --print-join-command --ttl 5m > "/etc/kubernetes/var/.join_cmd_{{ uid }}"

    - name: Fetch join command
      fetch:
        src: "/etc/kubernetes/var/.join_cmd_{{ uid }}"
        dest: ".join_cmd_{{ uid }}"
        flat: true


- name: Join the cluster as a control plane
  hosts: cp1, cp2
  become: true
  become_user: root

  tasks:

    - name: "Get var .join_cmd_{{ uid }}"
      copy:
        src: ".join_cmd_{{ uid }}"
        dest: "/etc/kubernetes/var/.join_cmd_{{ uid }}"

    - name: Join the cluster
      shell: >-
        $(cat "/etc/kubernetes/var/.join_cmd_{{ uid }}") --control-plane
        --apiserver-advertise-address={{ ansible_facts['eth1']['ipv4']['address'] }}

    - name: Allow Vagrant to read kubeconfig
      file:
        path: /etc/kubernetes/admin.conf
        owner: root
        group: vagrant
        mode: '640'


    - name: Record the control plane Pod subnet
      import_tasks: ../network/node-cidr.yml


- name: Join the cluster as a worker node
  vars_files:
    - ../../network.json
  hosts: wo0, wo1, wo2, wo3, wo4, wo5
  become: true
  become_user: root

  tasks:

    - name: "Get var .join_cmd_{{ uid }}"
      copy:
        src: ".join_cmd_{{ uid }}"
        dest: "/etc/kubernetes/var/.join_cmd_{{ uid }}"

    - name: Join the cluster
      shell: $(cat "/etc/kubernetes/var/.join_cmd_{{ uid }}")

    - name: Record the worker Pod subnet
      import_tasks: ../network/node-cidr.yml
