global
  user haproxy
  group haproxy
  log /dev/log local0 debug

defaults
  log global
  timeout client 10s
  timeout server 10s
  timeout connect 4s

# In this scenario, we assume that internal requests
# are sent to port 6443.
# We would configure UFW to only accept requests from
# known workers.
frontend apiserver-internal
  mode tcp
  option tcplog
  bind :6443
  default_backend apiserver-control-nodes

# In this scenario, we assume that public requests
# comes from a WAF with a single static IP.
# We want to use different UFW rules, and possibly
# haproxy rules as well.
frontend apiserver-public-gateway
  mode tcp
  option tcplog
  bind :9443
  default_backend apiserver-control-nodes

backend apiserver-control-nodes
  mode tcp
  option ssl-hello-chk
  balance roundrobin
  server c0 cp0:6443 check
  server c1 cp1:6443 check
  server c2 cp2:6443 check

