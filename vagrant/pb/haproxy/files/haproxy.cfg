global
  user haproxy
  group haproxy
  chroot /var/lib/haproxy
  log /dev/log local0 debug

defaults
  log global
  timeout client 10s
  timeout server 10s
  timeout connect 4s

frontend k8s-api-front
  mode tcp
  option tcplog
  bind :6443
  default_backend k8s-api-back

backend k8s-api-back
  mode tcp
  option tcplog
  option ssl-hello-chk
  balance roundrobin
  server c0 cp0:6443 check
  server c1 cp1:6443 check
  server c2 cp2:6443 check
