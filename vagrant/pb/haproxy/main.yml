---
- name: Configure haproxy
  hosts: lb0
  become: true
  become_user: root

  vars:
    hostname: "{{ inventory_hostname }}"

  tasks:

    - name: Install packages
      shell: apk add --allow-untrusted /.lfs/apk/haproxy/*

    - name: Create haproxy log file
      tags: rsyslog
      file:
        path: /var/log/haproxy.log
        state: touch
        owner: root
        group: haproxy
        mode: '0644'

    - name: Copy haproxy configuration
      copy:
        src: haproxy.cfg
        dest: /etc/haproxy/haproxy.cfg

    - name: Enable haproxy
      service:
        name: haproxy
        state: restarted
        enabled: yes
