---
- name: Copy cluster.yaml
  copy:
    src: apiserver.yaml
    dest: /etc/kubernetes/pki/apiserver.yaml

- name: Generate certs
  shell: "kubeadm init phase certs {{ item }}"
  loop:
    - ca
    - apiserver --config /etc/kubernetes/pki/apiserver.yaml
    - apiserver-kubelet-client
    - front-proxy-ca
    - front-proxy-client
    - etcd-ca
    - etcd-server
    - etcd-peer
    - etcd-healthcheck-client
    - apiserver-etcd-client
    - sa
