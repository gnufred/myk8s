---
- name: Generate certs
  shell: "kubeadm init phase certs {{ item }}"
  loop:
    - ca
    - "apiserver --control-plane-endpoint {{ cpe }}"
    - apiserver-kubelet-client
    - front-proxy-ca
    - front-proxy-client
    - etcd-ca
    - etcd-server
    - etcd-peer
    - etcd-healthcheck-client
    - apiserver-etcd-client
    - sa
