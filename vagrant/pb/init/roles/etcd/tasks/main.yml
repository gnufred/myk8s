---
- name: Check if kubeadm-flags.env exists
  stat:
    path: /etc/kubernetes/manifests/etcd.yaml
  register: etcdyaml

- name: Initialize etcd
  when: not etcdyaml.stat.exists
  shell: kubeadm init phase etcd local

- name: Wait for etcd to init
  when: not etcdyaml.stat.exists
  pause:
    seconds: 10
