---
- name: Check if kubeadm-flags.env exists
  stat:
    path: /var/lib/kubelet/kubeadm-flags.env
  register: file1

- name: Check if kubelet/config.yaml exists
  stat:
    path: /var/lib/kubelet/config.yaml
  register: file2

- name: Initialize kubelet
  when: (not file1.stat.exists) or (not file2.stat.exists)
  shell: kubeadm init phase kubelet-start

- name: Ensure kubelet service is running
  service:
    name: kubelet
    state: started
    enabled: yes

- name: Wait for init process to create pods
  when: (not file1.stat.exists) or (not file2.stat.exists)
  pause:
    seconds: 60
