---
- name: Initialize main control plane
  hosts: cp0,
  become: true
  become_user: root

  tasks:

  - name: Check if cluster is configured
    tags: init
    stat:
      path: /etc/kubernetes/pki/ca.crt
    register: cacert

  - name: Kubeadmin init
    tags: init
    when: not cacert.stat.exists
    shell: "kubeadm init --control-plane-endpoint {{ cpe }}"
    vars:
      cpe: '10.0.0.20:6443'

  - name: Fetch certificates
    tags: certs
    fetch:
      src: "/etc/kubernetes/pki/{{ item }}"
      dest: "../../.certs/{{ item }}"
      flat: true
    loop:
      - ca.crt
      - ca.key
      - sa.key
      - sa.pub
      - front-proxy-ca.crt
      - front-proxy-ca.key
      - etcd/ca.crt
      - etcd/ca.key

  - name: Allow Vagrant to read kubeconfig
    tags: bash
    file:
      path: /etc/kubernetes/admin.conf
      owner: root
      group: vagrant
      mode: '640'

  - name: Copy Vagrant bash files
    tags: bash
    copy:
      src: "{{ item }}"
      dest: "/home/vagrant/{{ item }}"
      owner: vagrant
      group: vagrant
      mode: '600'
    loop: 
      - .bash_profile
      - .bashrc

  - name: Copy root bash files
    tags: bash
    copy:
      src: "{{ item }}"
      dest: "/root/{{ item }}"
      owner: root
      group: root
      mode: '600'
    loop: 
      - .bash_profile
      - .bashrc

