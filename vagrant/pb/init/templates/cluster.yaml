apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: "{{ ansible_facts['eth1']['ipv4']['address'] }}"
nodeRegistration:
  criSocket: unix:///run/containerd/containerd.sock
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: "{{ kubernetes_version }}"
controlPlaneEndpoint: "10.1.2.10:6443"
networking:
  serviceSubnet: "{{ lab_service_subnet }}"
apiServer:
  certSANs:
    - "10.1.2.10"
  extraArgs:
    - name: requestheader-client-ca-file
      value: "/etc/kubernetes/pki/front-proxy-ca.crt"
    - name: requestheader-allowed-names
      value: "front-proxy-client"
    - name: requestheader-extra-headers-prefix
      value: "X-Remote-Extra-"
    - name: requestheader-group-headers
      value: "X-Remote-Group"
    - name: requestheader-username-headers
      value: "X-Remote-User"
    - name: proxy-client-cert-file
      value: "/etc/kubernetes/pki/front-proxy-client.crt"
    - name: proxy-client-key-file
      value: "/etc/kubernetes/pki/front-proxy-client.key"
    - name: enable-aggregator-routing
      value: "true"
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: cgroupfs
clusterDNS:
  - "{{ lab_dns_service_ip }}"
