- name: Configure bash environment
  hosts: cp0, cp1, cp2
  become: true
  become_user: root

  tasks:

  - name: Allow Vagrant to read kubeconfig
    file:
      path: /etc/kubernetes/admin.conf
      owner: root
      group: vagrant
      mode: '640'

  - name: Copy Vagrant bash files
    copy:
      src: "{{ item }}"
      dest: "/home/vagrant/{{ item }}"
      owner: vagrant
      group: vagrant
      mode: '600'
    loop: 
      - .bash_profile
      - .bashrc

  - name: Copy root bash files
    copy:
      src: "{{ item }}"
      dest: "/root/{{ item }}"
      owner: root
      group: root
      mode: '600'
    loop: 
      - .bash_profile
      - .bashrc

