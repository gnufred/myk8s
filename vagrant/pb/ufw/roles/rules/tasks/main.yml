---
- name: Allow dns
  ufw:
    rule: allow
    port: 53
    proto: '{{ item }}'
    direction: out
  loop:
      - tcp
      - udp

- name: Allow HTTPs
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    direction: out
  loop:
    - https

- name: Allow Kubernetes API server
  ufw:
    rule: allow
    port: 6443
    proto: tcp
    direction: "{{ item }}"
  loop:
    - in
    - out
