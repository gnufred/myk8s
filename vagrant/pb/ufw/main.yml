# Configure Uncomplicated Firewall
# https://manpages.ubuntu.com/manpages/jammy/en/man8/ufw.8.html
# https://docs.ansible.com/ansible/latest/collections/community/general/ufw_module.html
---
- name: Install and configure UFW
  hosts: all
  become: true
  become_user: root
  tasks:

  - name: Install dependencies
    shell: apk add --allow-untrusted /.lfs/apk/ufw/*

  - name: Enable UFW
    ufw:
      logging: high
      state: enabled

  - name: Enable UFW service
    service:
      name: ufw
      state: started
      enabled: yes

    # Just making sure lock ourselves out, if change
    # any other rules afterward.
  - name: SSH (in)
    ufw:
      rule: allow
      port: 22
      proto: tcp
      direction: in
      interface: eth0

    # The main goal is to log all network requests
    # in the firewall for inspection.
    # Given it's a test lab, I don't want to block
    # anything by default.
  - name: Allow everything
    ufw:
      direction: '{{ item }}'
      policy: allow
    loop:
      - incoming
      - outgoing
