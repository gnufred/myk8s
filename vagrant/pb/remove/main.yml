- name: Prepare removal
  hosts: cp0
  become: true
  become_user: root

  tasks:

  - name: Remove node from cluster
    shell: |
      source /root/.bashrc
      eid=$(etcdctl member list | grep "{{ uid }}" | cut -d, -f1) &&
      etcdctl member remove $eid

  - name: Remove node from cluster
    shell: |
      source /root/.bashrc
      kubectl delete node "{{ uid }}"

