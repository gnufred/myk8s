- name: "ClusterRole {{ sa_user }}"
  tags: rbac_admin
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: "{{ sa_user }}"
      rules:
      - apiGroups: [""]
        resources: ["*"]
        verbs: ["*"]

- name: ClusterRoleBinding admin-cluster-binding
  tags: rbac_admin
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ sa_user }}"
      subjects:
      - kind: User
        name: "{{ sa_user }}"
        apiGroup: rbac.authorization.k8s.io
      roleRef:
        kind: ClusterRole
        name: "{{ sa_user }}"
        apiGroup: rbac.authorization.k8s.io
