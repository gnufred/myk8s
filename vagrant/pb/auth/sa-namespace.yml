- name: "RoleBinding {{ sa_user }}-{{ namespace }}"
  tags: rbac
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "{{ sa_user }}-{{ namespace }}" 
        namespace: "{{ namespace }}"
      subjects:
      - kind: User
        name: "{{ sa_user }}"
        apiGroup: rbac.authorization.k8s.io
      roleRef:
        kind: Role
        name: cluster-admin
        apiGroup: rbac.authorization.k8s.io
