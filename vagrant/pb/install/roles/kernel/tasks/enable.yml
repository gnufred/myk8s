---
- name: "Load {{ module }}"
  community.general.modprobe:
    name: "{{ module }}"
    state: present

- name: "Add {{ module }} to /etc/module"
  lineinfile:
    line: "{{ module }}"
    dest: /etc/modules

- name: "Add {{ module }} to /etc/modules-load.d/containerd.conf"
  lineinfile:
    line: "{{ module }}"
    dest: /etc/modules-load.d/containerd.conf
