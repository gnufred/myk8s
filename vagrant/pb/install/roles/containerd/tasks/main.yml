---
- name: Create /etc/cni/net.d
  file:
    path: /etc/cni/net.d
    state: directory

- name: Copy 10-containerd-net.conflist
  copy:
    src: 10-containerd-net.conflist
    dest: /etc/cni/net.d/10-containerd-net.conflist

- name: Install containerd packages
  shell: apk add --allow-untrusted /.lfs/apk/containerd/*

- name: Enable containerd
  service:
    name: containerd
    enabled: yes
    state: started
