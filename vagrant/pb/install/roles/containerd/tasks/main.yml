---
- name: Create /etc/cni/net.d
  file:
    path: /etc/cni/net.d
    state: directory

- name: Copy 10-containerd-net.conflist
  copy:
    src: 10-containerd-net.conflist
    dest: /etc/cni/net.d/10-containerd-net.conflist

- name: Install containerd packages
  apk:
    name: "{{ item }}"
    repository: "{{ repo }}"
    state: present
  vars:
    repo: https://dl-cdn.alpinelinux.org/alpine/edge/community
  loop:
    - cni-plugins
    - containerd

- name: Enable containerd
  service:
    name: containerd
    state: started
    enabled: yes
