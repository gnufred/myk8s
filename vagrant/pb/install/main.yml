  ### ALL ###
- name: Configure rsyslog
  hosts: all
  become: true
  become_user: root

  tasks:

    ### DEBUG ###

  - name: Install debug packages
    tags: rsyslog
    shell: apk add --allow-untrusted /.lfs/apk/debug/*

    ### RSYSLOG ###
    
  - name: Copy rsyslog configuration
    tags: rsyslog
    template:
      src: rsyslog.conf
      dest: /etc/rsyslog.conf

  - name: Install packages
    tags: rsyslog
    shell: apk add --allow-untrusted /.lfs/apk/rsyslog/*

  - name: Enable rsyslog
    tags: rsyslog
    service:
      name: rsyslog
      state: restarted
      enabled: yes


  ### NODES ###
- name: Configure OS and install K8s packages
  vars_files:
    - ../../kubernetes.json
    - ../../network.json
  hosts: cp0, cp1, cp2, wo0, wo1, wo2, wo3, wo4, wo5
  become: true
  become_user: root

  tasks:


    ### KERNEL ###

  - name: Enable kernel modules
    tags: kernel
    include_tasks: enable.yml
    vars:
      module: "{{ item }}"
    loop:
      - overlay
      - br_netfilter

  - name: Create module container config file
    tags: kernel
    file:
      path: /etc/sysctl.d/kubernetes.conf
      state: touch

  - name: Enable required kernel options
    tags: kernel
    lineinfile:
      line: "{{ item }}"
      dest: /etc/sysctl.d/kubernetes.conf
    loop:
      - 'net.ipv4.ip_forward = 1'
      - 'net.bridge.bridge-nf-call-iptables = 1'
      - 'net.bridge.bridge-nf-call-ip6tables = 1'

  - name: Reload Kernel configuration
    tags: kernel
    shell: sysctl -p /etc/sysctl.d/kubernetes.conf


    # UFW can report routed traffic as disabled before IP forwarding is enabled.
    # Keep Pod DNS/API access independent of that initial default-policy check.
  - name: Allow Pod DNS queries to the lab resolver
    tags: pod-network
    community.general.ufw:
      rule: allow
      route: true
      interface_in: cni0
      from_ip: "{{ lab_pod_subnet }}"
      to_ip: "{{ lab_dns_forwarder_ip }}"
      port: '53'
      proto: "{{ item }}"
      comment: pod-dns
    loop:
      - udp
      - tcp

  - name: Allow Pod requests to the control plane APIs
    tags: pod-network
    community.general.ufw:
      rule: allow
      route: true
      interface_in: cni0
      from_ip: "{{ lab_pod_subnet }}"
      to_ip: "{{ item }}"
      port: '6443'
      proto: tcp
      comment: pod-api
    loop:
      - 10.1.2.20
      - 10.1.2.21
      - 10.1.2.22

    # Service DNAT happens before UFW sees the forwarded packet.
  - name: Allow the VM resolver to reach CoreDNS Pods
    tags: pod-network
    community.general.ufw:
      rule: allow
      route: true
      interface_in: "{{ lab_node_interface }}"
      from_ip: "{{ lab_dns_forwarder_ip }}"
      to_ip: "{{ lab_pod_subnet }}"
      port: '53'
      proto: "{{ item }}"
      comment: vm-cluster-dns
    loop:
      - udp
      - tcp

    ### CONTAINERD ###

  - name: Create /etc/cni/net.d
    tags: containerd
    file:
      path: /etc/cni/net.d
      state: directory

  - name: Copy 10-containerd-net.conflist
    tags: containerd
    copy:
      src: 10-containerd-net.conflist
      dest: /etc/cni/net.d/10-containerd-net.conflist

  - name: Configure crictl
    copy:
      src: crictl.yaml
      dest: /etc/crictl.yaml

  - name: Install containerd packages
    tags: containerd
    shell: apk add --allow-untrusted /.lfs/apk/containerd/*

  - name: Create containerd configuration directory
    tags: containerd
    file:
      path: /etc/containerd/conf.d
      state: directory
      mode: '0755'

  - name: Configure containerd for Kubernetes
    tags: containerd
    template:
      src: 20-kubernetes.toml
      dest: /etc/containerd/conf.d/20-kubernetes.toml
      owner: root
      group: root
      mode: '0644'
    register: containerd_config

  - name: Enable containerd
    tags: containerd
    service:
      name: containerd
      enabled: yes
      state: "{{ 'restarted' if containerd_config.changed else 'started' }}"

  - name: Wait for containerd to start
    wait_for:
      path: /run/containerd/containerd.sock
      timeout: 10

  - name: Allow non sudo crictl usage
    tags: containerd
    file:
      path: /run/containerd/containerd.sock
      owner: root
      group: vagrant


    ### KUBES ###

  - name: Install packages
    tags: kubes
    shell: apk add --allow-untrusted /.lfs/apk/kubes/*

  - name: Enable cgroup v2 service
    tags: kubes
    service:
      name: cgroups
      state: started
      enabled: yes

  - name: Check unified cgroup v2 controllers
    tags: kubes
    stat:
      path: /sys/fs/cgroup/cgroup.controllers
      get_checksum: false
    register: cgroup_controllers

  - name: Require cgroup v2 for Kubernetes
    tags: kubes
    assert:
      that: cgroup_controllers.stat.exists
      fail_msg: 'Kubernetes 1.36 requires this lab to boot with OpenRC unified cgroups (cgroup v2).'

  - name: Configure kubelet for the private node network
    tags: kubes
    template:
      src: kubelet.conf
      dest: /etc/conf.d/kubelet
      owner: root
      group: root
      mode: '0644'

  - name: Create Kubernetes config folders
    tags: kubes
    file:
      state: directory
      path: "/etc/kubernetes/{{ item }}"
    loop:
      - manifests
      - pki
      - pki/etcd
      - pki/user
      - run/certs
      - var

  - name: Create Kubelet log directory
    tags: kubes
    file:
      path: /var/log/kubelet/kubelet.log
      state: touch
      mode: 0640
      owner: root
      group: vagrant


  ### DIRS ###

- name: Load offline control plane container images
  vars_files:
    - ../../kubernetes.json
  hosts: cp0, cp1, cp2
  become: true
  become_user: root

  tasks:


    ### ETCD ###

  - name: Install etcdctl
    tags: etcd
    shell: apk add --allow-untrusted /.lfs/apk/etcd/*


    ### IMAGES ###

  - name: Upload offline control plane image archive
    tags: blobs
    copy:
      src: "{{ playbook_dir }}/../../.lfs/images/control-plane-{{ kubernetes_version }}-amd64.tar"
      dest: /tmp/myk8s-control-plane-images.tar
      owner: root
      group: root
      mode: '0644'

  - name: Import offline control plane images
    tags: blobs
    command:
      argv:
        - ctr
        - --namespace
        - k8s.io
        - images
        - import
        - --platform
        - linux/amd64
        - /tmp/myk8s-control-plane-images.tar

    ### BASH ###
    
  - name: Copy Vagrant bash files
    tags: shell
    copy:
      src: "{{ item }}"
      dest: "/home/vagrant/{{ item }}"
      owner: vagrant
      group: vagrant
      mode: '600'
    loop: 
      - .bash_profile
      - .bashrc

  - name: Copy root bash files
    tags: shell
    copy:
      src: "{{ item }}"
      dest: "/root/{{ item }}"
      owner: root
      group: root
      mode: '600'
    loop: 
      - .bash_profile
      - .bashrc

  ### WORKER IMAGES ###
- name: Load offline worker container images
  vars_files:
    - ../../kubernetes.json
  hosts: wo0, wo1, wo2, wo3, wo4, wo5
  become: true
  become_user: root

  tasks:

  - name: Upload offline worker image archive
    tags: blobs
    copy:
      src: "{{ playbook_dir }}/../../.lfs/images/worker-{{ kubernetes_version }}-amd64.tar"
      dest: /tmp/myk8s-worker-images.tar
      owner: root
      group: root
      mode: '0644'

  - name: Import offline worker images
    tags: blobs
    command:
      argv:
        - ctr
        - --namespace
        - k8s.io
        - images
        - import
        - --platform
        - linux/amd64
        - /tmp/myk8s-worker-images.tar

  ### NFS: ALL ###
- name: Install NFS
  hosts: nf0, wo0, wo1, wo2, wo3, wo4, wo5
  become: true
  become_user: root

  tasks:

  - name: Install nfs packages
    tags: nfs
    shell: apk add --allow-untrusted /.lfs/apk/nfs/*

  ### NFS: SERVER ###
- name: Configure NFS server
  hosts: nf0
  become: true
  become_user: root

  tasks:

  - name: Enable rpcbind
    tags: nfs
    service:
      name: rpcbind
      enabled: yes
      state: started

  - name: Create /export
    tags: nfs
    file:
      path: /export
      state: directory
      owner: root
      # The lab's vagrant group is GID 1000 on the server and workers.
      # Keep root_squash; workloads use UID/GID 1000 for writable volumes.
      group: vagrant
      mode: '2775'

  - name: Copy export config
    tags: nfs
    copy:
      src: exports
      dest: /etc/exports

  - name: Enable nfs
    tags: nfs
    service:
      name: nfs
      enabled: yes
      state: reloaded

