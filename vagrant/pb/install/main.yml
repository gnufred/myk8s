  ### ALL ###
- name: Configure rsyslog
  hosts: all
  become: true
  become_user: root

  tasks:


    ### RSYSLOG ###
    
  - name: Copy rsyslog configuration
    tags: rsyslog
    template:
      src: rsyslog.conf
      dest: /etc/rsyslog.conf

  - name: Install packages
    tags: rsyslog
    shell: apk add --allow-untrusted /.lfs/apk/rsyslog/*

  - name: Enable rsyslog
    tags: rsyslog
    service:
      name: rsyslog
      state: restarted
      enabled: yes


  ### NODES ###
- name: Configure OS and install K8s packages
  hosts: cp0, cp1, cp2, wo0, wo1, wo2, wo3, wo4, wo5
  become: true
  become_user: root

  tasks:


    ### KERNEL ###

  - name: Enable kernel modules
    tags: kernel
    include_tasks: enable.yml
    vars:
      module: "{{ item }}"
    loop:
      - overlay
      - br_netfilter

  - name: Create module container config file
    tags: kernel
    file:
      path: /etc/sysctl.d/kubernetes.conf
      state: touch

  - name: Enable required kernel options
    tags: kernel
    lineinfile:
      line: "{{ item }}"
      dest: /etc/sysctl.d/kubernetes.conf
    loop:
      - 'net.ipv4.ip_forward = 1'
      - 'net.bridge.bridge-nf-call-iptables = 1'
      - 'net.bridge.bridge-nf-call-ip6tables = 1'

  - name: Reload Kernel configuration
    tags: kernel
    shell: sysctl -p /etc/sysctl.d/kubernetes.conf


    ### CONTAINERD ###

  - name: Create /etc/cni/net.d
    tags: containerd
    file:
      path: /etc/cni/net.d
      state: directory

  - name: Copy 10-containerd-net.conflist
    tags: containerd
    copy:
      src: 10-containerd-net.conflist
      dest: /etc/cni/net.d/10-containerd-net.conflist

  - name: Install containerd packages
    tags: containerd
    shell: apk add --allow-untrusted /.lfs/apk/containerd/*

  - name: Enable containerd
    tags: containerd
    service:
      name: containerd
      enabled: yes
      state: started


    ### KUBES ###

  - name: Install packages
    tags: kubes
    shell: apk add --allow-untrusted /.lfs/apk/kubes/*

  - name: Create Kubernetes config folders
    tags: kubes
    file:
      state: directory
      path: "/etc/kubernetes/{{ item }}"
    loop:
      - manifests
      - pki
      - pki/etcd
      - pki/user
      - run/certs
      - var


  ### DIRS ###

- name: Upload control plane container image blobs
  hosts: cp0, cp1, cp2
  become: true
  become_user: root

  tasks:

  - name: Check if blogs are already uploaded
    tags: blobs
    stat:
      path: /var/lib/containerd/io.containerd.content.v1.content/blobs
    register: blobdir

  - name: Create image folder
    tags: blobs
    when: not blobdir.stat.exists
    file:
      path: /var/lib/containerd/io.containerd.content.v1.content/blobs
      state: directory

  - name: Upload blobs
    tags: blobs
    when: not blobdir.stat.exists
    copy:
      src: ../../../.lfs/blobs/sha256
      dest: /var/lib/containerd/io.containerd.content.v1.content/blobs
