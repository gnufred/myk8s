  ### ALL ###
- name: Configure rsyslog
  hosts: all
  become: true
  become_user: root

  tasks:

    ### DEBUG ###

  - name: Install debug packages
    tags: rsyslog
    shell: apk add --allow-untrusted /.lfs/apk/debug/*

    ### RSYSLOG ###
    
  - name: Copy rsyslog configuration
    tags: rsyslog
    template:
      src: rsyslog.conf
      dest: /etc/rsyslog.conf

  - name: Install packages
    tags: rsyslog
    shell: apk add --allow-untrusted /.lfs/apk/rsyslog/*

  - name: Enable rsyslog
    tags: rsyslog
    service:
      name: rsyslog
      state: restarted
      enabled: yes


  ### NODES ###
- name: Configure OS and install K8s packages
  hosts: cp0, cp1, cp2, wo0, wo1, wo2, wo3, wo4, wo5
  become: true
  become_user: root

  tasks:


    ### KERNEL ###

  - name: Enable kernel modules
    tags: kernel
    include_tasks: enable.yml
    vars:
      module: "{{ item }}"
    loop:
      - overlay
      - br_netfilter

  - name: Create module container config file
    tags: kernel
    file:
      path: /etc/sysctl.d/kubernetes.conf
      state: touch

  - name: Enable required kernel options
    tags: kernel
    lineinfile:
      line: "{{ item }}"
      dest: /etc/sysctl.d/kubernetes.conf
    loop:
      - 'net.ipv4.ip_forward = 1'
      - 'net.bridge.bridge-nf-call-iptables = 1'
      - 'net.bridge.bridge-nf-call-ip6tables = 1'

  - name: Reload Kernel configuration
    tags: kernel
    shell: sysctl -p /etc/sysctl.d/kubernetes.conf


    ### CONTAINERD ###

  - name: Create /etc/cni/net.d
    tags: containerd
    file:
      path: /etc/cni/net.d
      state: directory

  - name: Copy 10-containerd-net.conflist
    tags: containerd
    copy:
      src: 10-containerd-net.conflist
      dest: /etc/cni/net.d/10-containerd-net.conflist

  - name: Configure crictl
    copy:
      src: crictl.yaml
      dest: /etc/crictl.yaml

  - name: Install containerd packages
    tags: containerd
    shell: apk add --allow-untrusted /.lfs/apk/containerd/*

  - name: Configure containerd sandbox image
    tags: containerd
    replace:
      path: /etc/containerd/config.toml
      regexp: '^(\s*sandbox_image\s*=\s*).*$'
      replace: '\1"registry.k8s.io/pause:3.9"'
    register: containerd_sandbox

  - name: Enable containerd
    tags: containerd
    service:
      name: containerd
      enabled: yes
      state: "{{ 'restarted' if containerd_sandbox.changed else 'started' }}"

  - name: Wait for containerd to start
    wait_for:
      path: /run/containerd/containerd.sock
      timeout: 10

  - name: Allow non sudo crictl usage
    tags: containerd
    file:
      path: /run/containerd/containerd.sock
      owner: root
      group: vagrant


    ### KUBES ###

  - name: Install packages
    tags: kubes
    shell: apk add --allow-untrusted /.lfs/apk/kubes/*

  - name: Create Kubernetes config folders
    tags: kubes
    file:
      state: directory
      path: "/etc/kubernetes/{{ item }}"
    loop:
      - manifests
      - pki
      - pki/etcd
      - pki/user
      - run/certs
      - var

  - name: Create Kubelet log directory
    tags: kubes
    file:
      path: /var/log/kubelet/kubelet.log
      state: touch
      mode: 0640
      owner: root
      group: vagrant


  ### DIRS ###

- name: Load offline control plane container images
  hosts: cp0, cp1, cp2
  become: true
  become_user: root

  tasks:


    ### ETCD ###

  - name: Install etcdctl
    tags: etcd
    shell: apk add --allow-untrusted /.lfs/apk/etcd/*


    ### IMAGES ###

  - name: Upload offline control plane image archive
    tags: blobs
    copy:
      src: "{{ playbook_dir }}/../../.lfs/images/control-plane-v1.29.2-amd64.tar"
      dest: /tmp/myk8s-control-plane-images.tar
      owner: root
      group: root
      mode: '0644'

  - name: Import offline control plane images
    tags: blobs
    command:
      argv:
        - ctr
        - --namespace
        - k8s.io
        - images
        - import
        - --platform
        - linux/amd64
        - /tmp/myk8s-control-plane-images.tar

    ### BASH ###
    
  - name: Copy Vagrant bash files
    tags: shell
    copy:
      src: "{{ item }}"
      dest: "/home/vagrant/{{ item }}"
      owner: vagrant
      group: vagrant
      mode: '600'
    loop: 
      - .bash_profile
      - .bashrc

  - name: Copy root bash files
    tags: shell
    copy:
      src: "{{ item }}"
      dest: "/root/{{ item }}"
      owner: root
      group: root
      mode: '600'
    loop: 
      - .bash_profile
      - .bashrc

  ### WORKER IMAGES ###
