server:
    interface: 0.0.0.0
	access-control: 0.0.0.0/0 allow
    port: 53
    do-ip4: yes
    do-ip6: no  # Change to 'yes' if you want IPv6 support
    do-udp: yes
    do-tcp: yes

    forward-zone:
        name: "cluster.local"
        forward-addr: 10.1.2.20
        forward-addr: 10.1.2.21
        forward-addr: 10.1.2.22

    forward-zone:
        name: "."
		forward-addr: 1.1.1.1
		forward-addr: 1.0.0.1
		forward-addr: 8.8.8.8
		forward-addr: 8.8.4.4
