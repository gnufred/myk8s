---
- name: Configure load balancer DNS service
  vars_files:
    - ../../network.json
  hosts: lb0
  become: true
  become_user: root

  tasks:

    - name: Install packages
      tags: unbound
      shell: apk add --allow-untrusted /.lfs/apk/unbound/*

    # lb0 is outside Kubernetes: route Service IPs through a Kubernetes node.
    - name: Create interface hook directory
      tags: unbound
      file:
        path: /etc/network/if-up.d
        state: directory
        mode: '0755'

    - name: Configure persistent Service network route
      tags: unbound
      template:
        src: service-route
        dest: /etc/network/if-up.d/myk8s-service-route
        owner: root
        group: root
        mode: '0755'

    - name: Read current Service network route
      tags: unbound
      command: ip -4 route show {{ lab_service_subnet }}
      register: service_route
      changed_when: false

    - name: Apply Service network route
      tags: unbound
      command: /etc/network/if-up.d/myk8s-service-route
      environment:
        IFACE: "{{ lab_node_interface }}"
      changed_when: >-
        (lab_service_subnet ~ ' via ' ~ lab_service_gateway_ip ~ ' dev ' ~ lab_node_interface)
        not in service_route.stdout

    - name: Copy unbound config
      tags: unbound
      template:
        src: unbound.conf
        dest: /etc/unbound/unbound.conf
        validate: unbound-checkconf %s
      register: unbound_config

    - name: Enable unbound
      tags: unbound
      service:
        name: unbound
        state: "{{ 'restarted' if unbound_config.changed else 'started' }}"
        enabled: yes

- name: Configure cluster DNS service
  vars_files:
    - ../../kubernetes.json
    - ../../network.json
  hosts: cp0
  become: true
  become_user: root

  tasks:

    - name: Update CoreDNS configmap
      tags: coredns
      k8s:
        state: present
        kubeconfig: /etc/kubernetes/admin.conf
        namespace: kube-system
        kind: ConfigMap
        name: coredns
        definition:
          apiVersion: v1
          kind: ConfigMap
          data:
            Corefile: |
              .:53 {
                  errors
                  log
                  health {
                     lameduck 5s
                  }
                  ready
                  kubernetes cluster.local in-addr.arpa ip6.arpa {
                     pods insecure
                     fallthrough in-addr.arpa ip6.arpa
                     ttl 30
                  }
                  forward . {{ lab_dns_forwarder_ip }}
                  prometheus :9153
                  cache 30
                  loop
                  reload
                  loadbalance
              }

    - name: Reconfigure CoreDNS deployment
      tags: coredns
      k8s:
        state: present
        kubeconfig: /etc/kubernetes/admin.conf
        namespace: kube-system
        kind: Deployment
        name: coredns
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            annotations:
              deployment.kubernetes.io/revision: "2"
            labels:
              k8s-app: kube-dns
            name: coredns
            namespace: kube-system
          spec:
            progressDeadlineSeconds: 600
            replicas: 1
            revisionHistoryLimit: 10
            selector:
              matchLabels:
                k8s-app: kube-dns
            strategy:
              rollingUpdate:
                maxSurge: 25%
                maxUnavailable: 1
              type: RollingUpdate
            template:
              metadata:
                creationTimestamp: null
                labels:
                  k8s-app: kube-dns
              spec:
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: In
                              values:
                                - cp0
                  podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - podAffinityTerm:
                          labelSelector:
                            matchExpressions:
                              - key: k8s-app
                                operator: In
                                values:
                                  - kube-dns
                          topologyKey: kubernetes.io/hostname
                        weight: 100
                containers:
                  - args:
                      - -conf
                      - /etc/coredns/Corefile
                    image: "{{ kubernetes_coredns_image }}"
                    imagePullPolicy: IfNotPresent
                    livenessProbe:
                      failureThreshold: 5
                      httpGet:
                        path: /health
                        port: 8080
                        scheme: HTTP
                      initialDelaySeconds: 60
                      periodSeconds: 10
                      successThreshold: 1
                      timeoutSeconds: 5
                    name: coredns
                    ports:
                      - containerPort: 53
                        name: dns
                        protocol: UDP
                      - containerPort: 53
                        name: dns-tcp
                        protocol: TCP
                      - containerPort: 9153
                        name: metrics
                        protocol: TCP
                    readinessProbe:
                      failureThreshold: 3
                      httpGet:
                        path: /ready
                        port: 8181
                        scheme: HTTP
                      periodSeconds: 10
                      successThreshold: 1
                      timeoutSeconds: 1
                    resources:
                      limits:
                        memory: 170Mi
                      requests:
                        cpu: 100m
                        memory: 70Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        add:
                          - NET_BIND_SERVICE
                        drop:
                          - ALL
                      readOnlyRootFilesystem: true
                    terminationMessagePath: /dev/termination-log
                    terminationMessagePolicy: File
                    volumeMounts:
                      - mountPath: /etc/coredns
                        name: config-volume
                        readOnly: true
                dnsPolicy: Default
                nodeSelector:
                  kubernetes.io/os: linux
                  node-role.kubernetes.io/control-plane: ""
                priorityClassName: system-cluster-critical
                restartPolicy: Always
                schedulerName: default-scheduler
                securityContext: {}
                serviceAccount: coredns
                serviceAccountName: coredns
                terminationGracePeriodSeconds: 30
                tolerations:
                  - effect: NoSchedule
                    key: node-role.kubernetes.io/control-plane
                    operator: Exists
                  - effect: NoSchedule
                    key: node-role.kubernetes.io/master
                    operator: Exists
                volumes:
                  - configMap:
                      defaultMode: 420
                      items:
                        - key: Corefile
                          path: Corefile
                      name: coredns
                    name: config-volume

    - name: Configure kube-dns service
      tags: kubedns
      k8s:
        state: present
        kubeconfig: /etc/kubernetes/admin.conf
        name: kube-dns
        namespace: kube-system
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            annotations:
              prometheus.io/port: "9153"
              prometheus.io/scrape: "true"
            labels:
              k8s-app: kube-dns
              kubernetes.io/cluster-service: "true"
              kubernetes.io/name: CoreDNS
            name: kube-dns
            namespace: kube-system
          spec:
            clusterIP: "{{ lab_dns_service_ip }}"
            internalTrafficPolicy: Cluster
            ipFamilies:
            - IPv4
            ipFamilyPolicy: SingleStack
            ports:
            - name: dns
              port: 53
              protocol: UDP
              targetPort: 53
            - name: dns-tcp
              port: 53
              protocol: TCP
              targetPort: 53
            - name: metrics
              port: 9153
              protocol: TCP
              targetPort: 9153
            selector:
              k8s-app: kube-dns
            sessionAffinity: None
            type: ClusterIP

    - name: Wait for CoreDNS to become available
      tags: [coredns, kubedns]
      command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system
        rollout status deployment/coredns --timeout=120s
      changed_when: false
