---
- name: Configure load balancer DNS service
  hosts: lb0
  become: true
  become_user: root

  tasks:

    - name: Install packages
      shell: apk add --allow-untrusted /.lfs/apk/unbound/*

    - name: Copy unbound config
      copy:
        src: unbound.conf
        dest: /etc/unbound/unbound.conf

    - name: Enable unbound
      service:
        name: unbound
        state: started
        enabled: yes

- name: Configure cluster DNS service
  hosts: cp0
  become: true
  become_user: root

  tasks:

  - name: Update CoreDNS configmap
    tags: deployment
    k8s:
      state: present
      kubeconfig: /etc/kubernetes/admin.conf
      namespace: kube-system
      kind: ConfigMap
      name: coredns
      definition:
        apiVersion: v1
        kind: ConfigMap
        data:
          Corefile: |
            .:53 {
                errors
                log
                health {
                   lameduck 5s
                }
                ready
                kubernetes cluster.local in-addr.arpa ip6.arpa {
                   pods insecure
                   fallthrough in-addr.arpa ip6.arpa
                   ttl 30
                }
                prometheus :9153
                cache 30
                loop
                reload
                loadbalance
            }

  - name: Delete CoreDNS deployment
    tags: deployment
    k8s:
      state: absent
      kubeconfig: /etc/kubernetes/admin.conf
      namespace: kube-system
      kind: Deployment
      name: coredns

  - name: Create CoreDNS daemonset
    tags: deployment
    k8s:
      state: present
      kubeconfig: /etc/kubernetes/admin.conf
      namespace: kube-system
      kind: DaemonSet
      name: coredns
      definition:
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: coredns
          namespace: kube-system
          labels:
            k8s-app: kube-dns
        spec:
          selector:
            matchLabels:
              k8s-app: kube-dns
          template:
            metadata:
              labels:
                k8s-app: kube-dns
            spec:
              containers:
                - name: coredns
                  image: registry.k8s.io/coredns/coredns:v1.11.1
                  imagePullPolicy: IfNotPresent
                  args:
                    - -conf
                    - /etc/coredns/Corefile
                  ports:
                    - containerPort: 53
                      name: dns
                      protocol: UDP
                    - containerPort: 53
                      name: dns-tcp
                      protocol: TCP
                    - containerPort: 9153
                      name: metrics
                      protocol: TCP
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8080
                      scheme: HTTP
                    initialDelaySeconds: 60
                    periodSeconds: 10
                    timeoutSeconds: 5
                    successThreshold: 1
                    failureThreshold: 5
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: 8181
                      scheme: HTTP
                    periodSeconds: 10
                    timeoutSeconds: 1
                    successThreshold: 1
                    failureThreshold: 3
                  resources:
                    requests:
                      cpu: 100m
                      memory: 70Mi
                    limits:
                      memory: 170Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      add:
                        - NET_BIND_SERVICE
                      drop:
                        - ALL
                    readOnlyRootFilesystem: true
                  volumeMounts:
                    - name: config-volume
                      mountPath: /etc/coredns
                      readOnly: true
              volumes:
                - name: config-volume
                  configMap:
                    name: coredns
                    items:
                      - key: Corefile
                        path: Corefile
                    defaultMode: 420
              serviceAccountName: coredns
              dnsPolicy: Default
              priorityClassName: system-cluster-critical
              restartPolicy: Always
              nodeSelector:
                node-role.kubernetes.io/control-plane: ""
              tolerations:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
                effect: "NoSchedule"
              - key: "node-role.kubernetes.io/master"
                operator: "Exists"
                effect: "NoSchedule"

  - name: Delete kube-dns service
    tags: service
    k8s:
      kubeconfig: /etc/kubernetes/admin.conf
      kind: Service
      namespace: kube-system
      label_selectors:
        - k8s-app=kube-dns
      state: absent

  - name: Configure kube-dns service
    tags: service
    k8s:
      state: present
      kubeconfig: /etc/kubernetes/admin.conf
      name: kube-dns
      namespace: kube-system
      definition:
        apiVersion: v1
        kind: Service
        metadata:
          annotations:
            prometheus.io/port: "9153"
            prometheus.io/scrape: "true"
          labels:
            k8s-app: kube-dns
            kubernetes.io/cluster-service: "true"
            kubernetes.io/name: CoreDNS
          name: kube-dns
          namespace: kube-system
        spec:
          clusterIP: 10.1.2.20
          internalTrafficPolicy: Cluster
          ipFamilies:
          - IPv4
          ipFamilyPolicy: SingleStack
          ports:
          - name: dns
            port: 53
            protocol: UDP
            targetPort: 53
          - name: dns-tcp
            port: 53
            protocol: TCP
            targetPort: 53
          - name: metrics
            port: 9153
            protocol: TCP
            targetPort: 9153
          selector:
            k8s-app: kube-dns
          sessionAffinity: None
          type: ClusterIP
