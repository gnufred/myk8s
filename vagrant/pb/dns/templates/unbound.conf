server:
    interface: 0.0.0.0
    access-control: 0.0.0.0/0 allow
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

# Keep cluster-name resolution available to VMs outside Kubernetes.
forward-zone:
    name: "cluster.local"
    forward-addr: {{ lab_dns_service_ip }}

forward-zone:
    name: "."
    # Libvirt DNS uses the host resolver; direct guest Internet DNS may be blocked.
    forward-addr: {{ lab_external_dns_ip }}
