---
- name: Generate join command
  hosts: myk8s
  become: true
  become_user: root

  tasks:

    - name: Create var .join_cmd
      shell: |
        KUBECONFIG=/etc/kubernetes/admin.conf
        kubeadm token create --print-join-command --ttl 10s > /etc/kubernetes/var/.join_cmd

    - name: Fetch join command
      fetch:
        src: /etc/kubernetes/var/.join_cmd
        dest: .join_cmd
        flat: true

    - name: Delete var .join_cmd
      file:
        path: /etc/kubernetes/var/.join_cmd
        state: absent

- name: Join the cluster as a worker node
  hosts: walp1
  become: true
  become_user: root

  tasks:

    - name: Check if node has joined a cluster
      stat:
        path: /etc/kubernetes/kubelet.conf 
      register: joined

    - name: Get var .join_cmd
      when: not joined.stat.exists
      copy:
        src: .join_cmd
        dest: /etc/kubernetes/var/.join_cmd

    - name: Join the cluster
      when: not joined.stat.exists
      shell: |
        join_cmd=$(cat /etc/kubernetes/var/.join_cmd)
        $join_cmd

    - name: Delete var .join_cmd
      when: not joined.stat.exists
      file:
        path: /etc/kubernetes/var/.join_cmd
        state: absent
