# Certificates are created using
# CloudFlare's PKI/TLS toolkit
# https://github.com/cloudflare/cfssl
---
- name: Create config directories 
  file:
    path: "/etc/kubernetes/{{ item }}"
    state: directory
  loop:
    - pki/user
    - run/certs

- name: Copy helper scripts
  copy:
    src: "{{ item }}"
    dest: /etc/kubernetes/run/certs
    mode: 500
  loop:
    - generate
    - dump-api-ca

- name: Set sa_user variable file
  shell: "echo '{{ sa_user }}' > /etc/kubernetes/var/.sa_user"

- name: Generate cert files
  shell: /etc/kubernetes/run/certs/generate

- name: Download cert files
  tags: get-certs
  fetch:
    src: "/etc/kubernetes/pki/user/{{ sa_user }}.{{ item }}"
    dest: ".certs/{{ sa_user }}.{{ item }}"
    flat: true
  loop:
    - crt
    - key

- name: Dump the API server CA
  tags: get-certs
  shell: /etc/kubernetes/run/certs/dump-api-ca

- name: Download ca cert files
  tags: get-certs
  fetch:
    src: /etc/kubernetes/pki/apiserver-ca.crt
    dest: .certs/api-ca.crt
    flat: true

