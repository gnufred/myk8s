- name: ClusterRole admin-cluster
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: admin-cluster
      rules:
      - apiGroups: [""]
        resources: ["*"]
        verbs: ["*"]

- name: ClusterRoleBinding admin-cluster-binding
  kubernetes.core.k8s:
    kubeconfig: /etc/kubernetes/admin.conf
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: admin-cluster-binding
      subjects:
      - kind: User
        name: '{{ user }}'
        apiGroup: rbac.authorization.k8s.io
      roleRef:
        kind: ClusterRole
        name: admin-cluster
        apiGroup: rbac.authorization.k8s.io

