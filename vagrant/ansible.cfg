[defaults]
# Keep Python discovery without the interpreter-selection warning.
interpreter_python = auto_silent

[ssh_connection]
# Disposable Vagrant VMs regenerate host keys and reuse addresses.
ssh_common_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

[privilege_escalation]
# The Alpine base box provides passwordless doas.
become_method = community.general.doas
