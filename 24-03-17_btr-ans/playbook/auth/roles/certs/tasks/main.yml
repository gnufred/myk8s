# Certificates are created using
# CloudFlare's PKI/TLS toolkit
# https://github.com/cloudflare/cfssl
---
- name: Set username variable file
  shell: "echo '{{ user }}' > /etc/kubernetes/var/uname"

- name: Create config directories 
  file:
    path: "/etc/kubernetes/{{ item }}"
    state: directory
  loop:
    - pki/user
    - run/certs

- name: Copy helper scripts
  copy:
    src: "{{ item }}"
    dest: /etc/kubernetes/run/certs
    mode: 500
  loop:
    - gen

- name: Generate cert files
  shell: /etc/kubernetes/run/certs/gen

- name: Download cert files
  tags: get-certs
  fetch:
    src: "/etc/kubernetes/pki/user/{{ user }}.{{ item }}"
    dest: "../../.certs/{{ user }}.{{ item }}"
    flat: true
  loop:
    - crt
    - key
