# Limit DNS to 3 entries
# https://github.com/canonical/microk8s/issues/3786
---
- name: Configure resolved
  copy:
    src: resolved.conf
    dest: /etc/systemd/resolved.conf

- name: Configure network plan
  copy:
    src: 10-netplan-eth0.network
    dest: /run/systemd/network/10-netplan-eth0.network

- name: Change DNS runtime configuration
  shell: resolvectl dns 2 1.1.1.1

- name: Restart systemd-resolved 
  service:
    name: systemd-resolved
    state: restarted
