---
- name: Add K8s GPG key
  apt_key:
    url: https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key
    state: present

- name: Add K8s repository
  apt_repository:
    repo: deb https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /
    state: present
    filename: kubernetes

- name: "Install {{ item }}"
  include_tasks: install.yml
  vars:
    package: "{{ item }}"
    version: 1.29.1-1.1
  loop:
    - kubelet
    - kubectl
    - kubeadm
