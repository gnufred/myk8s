# This playbook doesn't do much.
# That's intended. The goal is to have Vagrant
# create the `vagrant_ansible_inventory` which
# we will reuse to run playbook manually.
---
- name: Provision the Vagrant VM
  hosts: myk8s
  become: true
  become_user: root

  tasks:

    - name: Set hostname
      hostname:
        name: myk8s

    - name: Create Kubernetes config folders
      file:
        state: directory
        path: "/etc/kubernetes/{{ item }}"
      loop:
        - manifests/rbac
        - run
        - var

    - name: Save var hostname
      shell: echo myk8s > /etc/kubernetes/var/hostname 

    - name: Save kubeconfig
      shell: echo "/etc/kubernetes/admin.conf" > /etc/kubernetes/var/kubeconfig
