---
- name: Configure OS and install K8s packages
  hosts: myk8s
  become: true
  become_user: root

  roles:
    - {role: dns, tags: role_dns} 
    - {role: apparmor, tags: role_apparmor}
    - {role: swapoff, tags: role_swapoff} 
    - {role: kernel, tags: role_kernel} 
    - {role: containerd, tags: role_containerd} 
    - {role: kubes, tags: role_kubes} 
    - {role: config, tags: role_config} 
