---
- name: List images
  shell: crictl images list | grep registry.k8s.io | grep 'coredns\|etcd\|kube-apiserver\|kube-controller-manager\|kube-proxy\|kube-scheduler\|pause' | wc -l
  register: k8s_images_count

- name: Pull images
  when: k8s_images_count.stdout != '7'
  shell: kubeadm config images pull

- name: Run pre flight checks
  when: k8s_images_count.stdout != '7'
  shell: |
    kubeadm init phase preflight \
      --ignore-preflight-errors=NumCPU,Mem
