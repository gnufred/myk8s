# Certificates are created using
# CloudFlare's PKI/TLS toolkit
# https://github.com/cloudflare/cfssl
---
- name: Create user certs directory
  file:
    path: /etc/kubernetes/pki/user
    state: directory

- name: Create user certs config directory
  file:
    path: /etc/cluster/certs
    state: directory

- name: Create username variable file
  file:
    path: /etc/cluster/certs/uname
    state: touch
    mode: 400

- name: Set username variable file
  shell: echo 'vagrant' > /etc/cluster/certs/uname

- name: Copy helper scripts
  copy:
    src: "{{ item }}"
    dest: /etc/cluster/certs
    mode: 500
  loop: "{{ query('fileglob', '*') }}"

- name: Check if vagrant.crt exists
  stat:
    path: /etc/kubernetes/pki/user/vagrant.crt
  register: crt

- name: Check if vagrant.key exists
  stat:
    path: /etc/kubernetes/pki/user/vagrant.key 
  register: key

- name: Generate and set vagrant cert files
  when: (not crt.stat.exists) or (not key.stat.exists)
  shell: echo
  notify:
    - gen user cert files
    - set user cert files
