- name: Configure API authentication
  hosts: cplane
  become: true
  become_user: root

  roles:
    - roles
    - bindings
    - certs
    - apply
    
  handlers:
    - name: gen user cert files
      shell: "/etc/cluster/certs/gen.sh"
    - name: set user cert files
      shell: "/etc/cluster/certs/set.sh"
