---
- name: Install Kubernetes control plane
  hosts: cplane
  become: true
  become_user: root

  roles:
   - prepare
   - dns
   - swapoff
   - kernel
   - containerd
   - kubes
   - k8s


  handlers:

    - name: Restart systemd-resolved 
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted

    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
