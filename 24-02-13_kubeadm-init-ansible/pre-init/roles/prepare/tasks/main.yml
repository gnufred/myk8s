---
- name: Set hostname
  ansible.builtin.hostname:
    name: cplane

- name: Install iw
  ansible.builtin.apt:
    name: iw
    state: latest

- name: Install golang-cfssl
  ansible.builtin.apt:
    name: golang-cfssl
    state: latest

- name: Disable app armor 
  ansible.builtin.systemd_service:
    name: apparmor
    state: stopped
    enabled: false
