---
- name: Create module container config file
  ansible.builtin.file:
    path: /etc/modules-load.d/containerd.conf
    state: touch

- name: Load overlay
  ansible.builtin.import_tasks: enable.yml
  vars:
    kernel_module: overlay

- name: Load br_netfilter
  ansible.builtin.import_tasks: enable.yml
  vars:
    kernel_module: br_netfilter

- name: Create module container config file
  ansible.builtin.file:
    path: /etc/sysctl.d/20-kubernetes.conf
    state: touch

- name: Enable IPv4 IP forwarding 
  lineinfile:
    line: 'net.ipv4.ip_forward = 1'
    dest: /etc/sysctl.d/20-kubernetes.conf

- name: Enable IPv4 tables 
  lineinfile:
    line: 'net.bridge.bridge-nf-call-iptables = 1'
    dest: /etc/sysctl.d/20-kubernetes.conf

- name: Enable IPv6 tables 
  lineinfile:
    line: 'net.bridge.bridge-nf-call-ip6tables = 1'
    dest: /etc/sysctl.d/20-kubernetes.conf

- name: Reload Kernel configuration
  shell: sysctl --system
