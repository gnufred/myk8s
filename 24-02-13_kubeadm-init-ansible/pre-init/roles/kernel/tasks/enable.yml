---
- name: "Load {{ kernel_module }}"
  community.general.modprobe:
    name: "{{ kernel_module }}"
    state: present

- name: "Add {{ kernel_module }} to /etc/module"
  lineinfile:
    line: "{{ kernel_module }}"
    dest: /etc/modules

- name: "Add {{ kernel_module }} to /etc/modules-load.d/containerd.conf"
  lineinfile:
    line: "{{ kernel_module }}"
    dest: /etc/modules-load.d/containerd.conf
